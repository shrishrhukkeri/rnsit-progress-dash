services:
  - type: web
    name: rnsit-progress-dash
    runtime: node
    plan: free
    repo: https://github.com/shrishrhukkeri/rnsit-progress-dash
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health

  # Optional keep-alive (Render Cron Jobs require a paid plan).
  # Or use https://cron-job.org → GET https://rnsit-progress-dash.onrender.com/health every 10 min.
  # - type: cron
  #   name: rnsit-progress-dash-keepalive
  #   runtime: node
  #   plan: starter
  #   schedule: "*/10 * * * *"
  #   buildCommand: "true"
